<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>calc-tools demo</title>
<style>
  :root { --fg: #1f1d18; --muted: #6a665c; --bg: #f7f6f2; --card: #fff; --line: #e2ded3; --accent: #a6620e; --warn: #9a3412; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #ece8dd; --muted: #a39e90; --bg: #17160f; --card: #201e17; --line: #36332a; --accent: #e0a04a; --warn: #fdba74; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; font: 15px/1.5 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; max-width: 1200px; margin: 0 auto 16px; }
  h1 { font-size: 1.3rem; margin: 0 auto 0 0; }
  input, select, button { font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
  #search { flex: 1 1 240px; }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; max-width: 1200px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; min-width: 0; }
  .card:target { outline: 2px solid var(--accent); }
  .card h2 { font-size: 1.05rem; margin: 0 0 4px; }
  .card p { color: var(--muted); font-size: 0.85rem; margin: 0 0 8px; }
  .field { display: grid; grid-template-columns: 1fr 9rem; gap: 8px; align-items: center; margin: 4px 0; }
  .field input, .field select { width: 100%; }
  .group { border: 1px dashed var(--line); border-radius: 6px; padding: 4px 8px; margin: 6px 0; }
  .out { display: flex; justify-content: space-between; gap: 8px; border-top: 1px solid var(--line); padding-top: 4px; margin-top: 4px; }
  .out b { font-variant-numeric: tabular-nums; }
  .warn { color: var(--warn); font-size: 0.85rem; margin: 6px 0 0; }
  details { font-size: 0.8rem; color: var(--muted); margin-top: 8px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>calc-tools</h1>
  <input id="search" type="search" placeholder="Hledat…" aria-label="Search">
  <select id="lang" aria-label="Language"><option value="cs">cs</option><option value="en">en</option></select>
</header>
<main id="cards"></main>
<script type="module">
import { tools, search, convert, calculate, localize } from '../calc_tools/static/calc_tools/index.js';

const cards = document.getElementById('cards');
const searchBox = document.getElementById('search');
const langSelect = document.getElementById('lang');
let lang = 'cs';

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, value);
  }
  node.append(...children);
  return node;
}

function format(value, precision) {
  if (typeof value !== 'number') return '–';
  const text = value.toFixed(precision ?? 2);
  return lang === 'cs' ? text.replace('.', ',') : text;
}

function control(input, value, onChange) {
  if (input.type === 'select') {
    const select = el('select', { onchange: () => onChange(select.value) },
      ...input.options.map((option) => el('option', { value: option.value }, localize(option.label, lang))));
    select.value = value;
    return select;
  }
  const field = el('input', { inputmode: 'decimal', oninput: () => onChange(field.value) });
  field.value = value === undefined || value === null ? '' : format(value, 10).replace(/[.,]?0+$/, '');
  return field;
}

function labelled(text, unit, node) {
  unit = localize(unit, lang);
  return el('label', { class: 'field' }, el('span', {}, text + (unit ? ` (${unit})` : '')), node);
}

function warnings(box, list) {
  box.replaceChildren(...list.map((warning) => el('div', {}, localize(warning, lang))));
}

function renderConverter(tool, body) {
  const fields = {};
  const params = {};
  const warn = el('div', { class: 'warn' });
  const start = tool.units.find((unit) => unit.default !== undefined) ?? tool.units[0];
  let last = { unit: start.id, value: start.default ?? 1 };
  const update = () => {
    const result = convert(tool, last.value, last.unit, params);
    for (const unit of tool.units) {
      if (unit.id !== last.unit) fields[unit.id].value = result.values[unit.id] === null ? '' : format(result.values[unit.id], unit.precision);
    }
    warnings(warn, result.warnings);
  };
  for (const unit of tool.units) {
    fields[unit.id] = control({ type: 'number' }, unit.id === last.unit ? last.value : '', (value) => { last = { unit: unit.id, value }; update(); });
    body.append(labelled(localize(unit.label, lang), '', fields[unit.id]));
  }
  for (const param of tool.params ?? []) {
    body.append(labelled(localize(param.label, lang), param.unit, control(param, param.default, (value) => { params[param.id] = value; update(); })));
  }
  body.append(warn);
  update();
}

function renderCalculator(tool, body) {
  const values = {};
  const outputs = el('div');
  const warn = el('div', { class: 'warn' });
  const update = () => {
    const result = calculate(tool, values);
    outputs.replaceChildren(...tool.outputs.flatMap((output) => {
      const value = result.values[output.id];
      const label = localize(output.label, lang);
      const row = (text, number) => el('div', { class: 'out' }, el('span', {}, text), el('b', {}, `${format(number, output.precision)} ${localize(output.unit, lang)}`));
      return Array.isArray(value) ? value.map((item, index) => row(`${label} ${index + 1}`, item)) : [row(label, value)];
    }));
    warnings(warn, result.warnings);
  };
  const inputsBox = el('div');
  const renderInputs = () => {
    inputsBox.replaceChildren(...tool.inputs.map((input) => {
      if (input.type !== 'list') {
        return labelled(localize(input.label, lang), input.unit, control(input, values[input.id] ?? input.default, (value) => { values[input.id] = value; update(); }));
      }
      values[input.id] ??= Array.from({ length: input.min ?? 1 }, () => ({}));
      const items = values[input.id];
      const groups = items.map((item, index) => el('div', { class: 'group' },
        el('strong', {}, `${localize(input.label, lang)} ${index + 1}`),
        ...input.fields.map((field) => labelled(localize(field.label, lang), field.unit,
          control(field, item[field.id] ?? field.default, (value) => { item[field.id] = value; update(); }))),
        items.length > (input.min ?? 0) ? el('button', { type: 'button', onclick: () => { items.splice(index, 1); renderInputs(); update(); } }, '−') : '',
      ));
      const add = items.length < (input.max ?? Infinity)
        ? el('button', { type: 'button', onclick: () => { items.push({}); renderInputs(); update(); } }, '+')
        : '';
      return el('div', {}, ...groups, add);
    }));
  };
  renderInputs();
  body.append(inputsBox, outputs, warn);
  update();
}

function render() {
  const found = new Set(search(searchBox.value, lang));
  cards.replaceChildren(...tools.filter((tool) => found.has(tool)).map((tool) => {
    const card = el('section', { class: 'card', id: tool.id },
      el('h2', {}, el('a', { href: `#${tool.id}` }, localize(tool.name, lang))),
      el('p', {}, localize(tool.description, lang)));
    if (tool.kind === 'converter') renderConverter(tool, card);
    else renderCalculator(tool, card);
    card.append(el('details', {}, el('summary', {}, lang === 'cs' ? 'Zdroje' : 'References'),
      ...tool.references.map((ref) => el('div', {}, ref.url ? el('a', { href: ref.url }, ref.title) : ref.title))));
    return card;
  }));
}

searchBox.addEventListener('input', render);
langSelect.addEventListener('change', () => { lang = langSelect.value; document.documentElement.lang = lang; render(); });
render();
if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
</script>
</body>
</html>
